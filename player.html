<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>브로가드 플레이어 — 브로가드 뮤직 랩</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/abcjs/6.5.2/abcjs-basic-min.js"></script>
<style>
  :root {
    --paper: #f3ecdd; --card: #fbf7ee; --ink: #1c2b3a; --ink-soft: #4a5a68;
    --brass: #b5894e; --brass-deep: #8a6a3a; --line: #d8d2c4;
    --ok: #2e7d4f; --warn: #c0392b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Segoe UI', '맑은 고딕', sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
  header { position: relative; background: var(--ink); color: #f3efe4; padding: 24px 20px 20px; }
  header .home { position: absolute; right: 16px; top: 16px; color: #c9c2b0; font-size: .78rem; text-decoration: none; }
  header .home:hover { color: var(--brass); }
  header h1 { margin: 0; font-size: 1.3rem; letter-spacing: .02em; }
  header h1 .m { color: var(--brass); }
  header p { margin: 5px 0 0; font-size: .82rem; color: #c9c2b0; }
  main { max-width: 900px; margin: 0 auto; padding: 16px 14px 60px; display: flex; flex-direction: column; gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .card h2 { margin: 0 0 10px; font-size: 1.02rem; }
  button.act { padding: 11px 18px; font-size: .95rem; font-weight: 700; border-radius: 9px; border: none; cursor: pointer; font-family: inherit; }
  .btn-go { background: var(--brass); color: #fff; } .btn-go:hover { background: var(--brass-deep); }
  .btn-ink { background: var(--ink); color: #fff; }
  .btn-ghost { background: var(--card); color: var(--ink); border: 1px solid var(--line); }
  button.act:disabled { opacity: .5; cursor: default; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .opts { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin-top: 10px; font-size: .85rem; font-weight: 600; }
  .opts label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
  .opts select { font-family: inherit; font-size: .85rem; padding: 5px 7px; border: 1px solid var(--line); border-radius: 7px; background: #fff; color: var(--ink); }
  #now { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  #nowTitle { font-size: 1.15rem; font-weight: 800; color: var(--brass-deep); }
  #nowSub { font-size: .82rem; color: var(--ink-soft); }
  #status { font-size: .84rem; color: var(--ink-soft); margin-top: 9px; min-height: 1.2em; }
  #status.err { color: var(--warn); }
  ul.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }
  ul.list li { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 9px; padding: 7px 10px; background: #fffdf7; font-size: .9rem; }
  ul.list li .t { flex: 1; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  ul.list li .cat { font-size: .7rem; color: var(--ink-soft); background: var(--paper); border-radius: 999px; padding: 2px 8px; white-space: nowrap; }
  ul.list li button { font: inherit; font-size: .78rem; font-weight: 700; cursor: pointer; border: 1px solid var(--line); background: #fff; border-radius: 7px; padding: 4px 9px; color: var(--ink-soft); }
  ul.list li button:hover { border-color: var(--brass); color: var(--brass-deep); }
  #plist li.cur { border-color: var(--brass); background: #f7efdd; box-shadow: inset 3px 0 0 var(--brass); }
  #plist li.cur .t { color: var(--brass-deep); }
  .row-btns { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .empty { font-size: .84rem; color: var(--ink-soft); padding: 8px 2px; }
  .hint { font-size: .78rem; color: var(--ink-soft); line-height: 1.6; margin-top: 10px; }
  .hint b { color: var(--brass-deep); }
  #holder { position: absolute; left: -9999px; top: 0; width: 760px; }
</style>
</head>
<body>
<header>
  <a class="home" href="index.html">&larr; 랩 홈</a>
  <h1>🎧 브로가드 <span class="m">플레이어</span></h1>
  <p>악보집의 곡들을 재생목록에 담아 이어서 감상해요 · 개인 소장용(공유·배포 금지)</p>
</header>
<main>

  <div class="card">
    <div id="now"><span id="nowTitle">—</span><span id="nowSub"></span></div>
    <div class="controls">
      <button class="act btn-go" id="playBtn">▶ 재생</button>
      <button class="act btn-ghost" id="pauseBtn" disabled>⏸ 일시정지</button>
      <button class="act btn-ink" id="stopBtn" disabled>■ 정지</button>
      <button class="act btn-ghost" id="prevBtn">⏮ 이전</button>
      <button class="act btn-ghost" id="nextBtn">⏭ 다음</button>
    </div>
    <div class="opts">
      <label title="목록 끝나면 처음부터 다시"><input type="checkbox" id="loopChk"> 🔁 전체 반복</label>
      <label title="끄면 코드 기호의 자동 기타 반주 없이 멜로디·베이스만"><input type="checkbox" id="chordAccChk" checked> 🎸 코드 반주</label>
      <label>🔊 음질
        <select id="soundSel">
          <option value="fluid">기본 피아노</option>
          <option value="musyng">고음질 피아노 (첫 로딩 느림)</option>
        </select>
      </label>
    </div>
    <div id="status">악보집에서 곡을 담고 ▶ 재생을 누르세요.</div>
  </div>

  <div class="card">
    <h2>📜 재생목록 <span id="plCount" style="font-weight:400;color:var(--ink-soft);font-size:.8rem;"></span></h2>
    <div class="row-btns">
      <button class="act btn-ghost" id="shuffleBtn">🔀 섞기</button>
      <button class="act btn-ghost" id="clearBtn">🗑 비우기</button>
    </div>
    <ul class="list" id="plist"></ul>
    <div class="empty" id="plEmpty">재생목록이 비어 있어요. 아래 악보집에서 ➕로 담아주세요.</div>
    <p class="hint">재생목록은 이 브라우저에 <b>자동 저장</b>돼요. 곡이 끝나면 자동으로 다음 곡이 이어집니다.</p>
  </div>

  <div class="card">
    <h2>📚 내 악보집</h2>
    <div class="row-btns">
      <button class="act btn-ghost" id="addAllBtn">➕ 전체 담기</button>
      <button class="act btn-ghost" id="refreshBtn">🔄 새로고침</button>
    </div>
    <ul class="list" id="liblist"></ul>
    <div class="empty" id="libEmpty">악보집이 비어 있어요. <a href="library.html">악보집</a>에서 곡을 저장하면 여기 나타나요.</div>
  </div>

  <div id="holder"></div>
</main>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var MUSYNG = "https://paulrosen.github.io/midi-js-soundfonts/MusyngKite/";
  var LIST_KEY = "broguard_player_list", PREF_KEY = "broguard_player_prefs";

  /* ── 악보집 ── */
  function libEntries() {
    var lib = null;
    try { lib = JSON.parse(localStorage.getItem("broguard_library") || ""); } catch (e) {}
    return (lib && lib.entries) ? lib.entries : (Array.isArray(lib) ? lib : []);
  }
  function findEntry(item) {
    var es = libEntries();
    for (var i = 0; i < es.length; i++) if (item.id && es[i].id === item.id) return es[i];
    for (var j = 0; j < es.length; j++) if (es[j].title === item.title) return es[j];
    return null;
  }

  /* ── 재생목록 (자동 저장) ── */
  var playlist = [];
  try { playlist = JSON.parse(localStorage.getItem(LIST_KEY) || "[]") || []; } catch (e) { playlist = []; }
  function saveList() { try { localStorage.setItem(LIST_KEY, JSON.stringify(playlist)); } catch (e) {} }
  function savePrefs() {
    try { localStorage.setItem(PREF_KEY, JSON.stringify({ loop: $("loopChk").checked, chord: $("chordAccChk").checked, sound: $("soundSel").value })); } catch (e) {}
  }
  try {
    var p = JSON.parse(localStorage.getItem(PREF_KEY) || "");
    if (p) { $("loopChk").checked = !!p.loop; $("chordAccChk").checked = p.chord !== false; if (p.sound) $("soundSel").value = p.sound; }
  } catch (e) {}

  /* ── 상태 ── */
  var curIdx = -1, synth = null, audioCtx = null, isPlaying = false, isPaused = false, playToken = 0;

  function setStatus(msg, err) { var s = $("status"); s.textContent = msg || ""; s.className = err ? "err" : ""; }
  function renderNow() {
    var it = (curIdx >= 0 && curIdx < playlist.length) ? playlist[curIdx] : null;
    $("nowTitle").textContent = it ? it.title : "—";
    $("nowSub").textContent = it ? ((curIdx + 1) + " / " + playlist.length + "곡") : (playlist.length ? playlist.length + "곡 대기" : "");
    renderPlaylist();
  }

  /* ── 목록 그리기 ── */
  function renderPlaylist() {
    var ul = $("plist"); ul.innerHTML = "";
    $("plEmpty").style.display = playlist.length ? "none" : "block";
    $("plCount").textContent = playlist.length ? "· " + playlist.length + "곡" : "";
    playlist.forEach(function (it, i) {
      var li = document.createElement("li");
      if (i === curIdx) li.className = "cur";
      var t = document.createElement("span"); t.className = "t"; t.textContent = (i + 1) + ". " + it.title; li.appendChild(t);
      [["▶", function () { startFrom(i); }, "이 곡부터 재생"],
       ["↑", function () { if (i > 0) { move(i, i - 1); } }, "위로"],
       ["↓", function () { if (i < playlist.length - 1) { move(i, i + 1); } }, "아래로"],
       ["✕", function () { removeAt(i); }, "빼기"]].forEach(function (b) {
        var btn = document.createElement("button"); btn.type = "button"; btn.textContent = b[0]; btn.title = b[2];
        btn.addEventListener("click", b[1]); li.appendChild(btn);
      });
      ul.appendChild(li);
    });
  }
  function move(a, b) {
    var x = playlist.splice(a, 1)[0]; playlist.splice(b, 0, x);
    if (curIdx === a) curIdx = b; else if (curIdx === b) curIdx = a;
    saveList(); renderNow();
  }
  function removeAt(i) {
    playlist.splice(i, 1);
    if (i === curIdx) { stopAll(); curIdx = -1; }
    else if (i < curIdx) curIdx--;
    saveList(); renderNow();
  }
  function renderLibrary() {
    var ul = $("liblist"); ul.innerHTML = "";
    var es = libEntries().slice().sort(function (a, b) { return (b.added || 0) - (a.added || 0); });
    $("libEmpty").style.display = es.length ? "none" : "block";
    es.forEach(function (e) {
      if (!e || !e.abc) return;
      var li = document.createElement("li");
      var t = document.createElement("span"); t.className = "t"; t.textContent = e.title || "(제목 없음)"; li.appendChild(t);
      if (e.cat) { var c = document.createElement("span"); c.className = "cat"; c.textContent = e.cat; li.appendChild(c); }
      var add = document.createElement("button"); add.type = "button"; add.textContent = "➕ 담기";
      add.addEventListener("click", function () {
        playlist.push({ id: e.id || "", title: e.title || "(제목 없음)" });
        saveList(); renderNow();
        setStatus("'" + (e.title || "곡") + "'을(를) 재생목록에 담았어요. (" + playlist.length + "곡)");
      });
      li.appendChild(add);
      ul.appendChild(li);
    });
  }

  /* ── 재생 엔진 ── */
  function stopSynth() { if (synth) { try { synth.stop(); } catch (e) {} synth = null; } }
  function stopAll() {
    playToken++;
    stopSynth();
    isPlaying = false; isPaused = false;
    $("stopBtn").disabled = true; $("pauseBtn").disabled = true; $("pauseBtn").textContent = "⏸ 일시정지";
    $("playBtn").disabled = false;
    renderPlaylist();
  }
  async function ensureAudio() {
    if (!audioCtx) { var AC = window.AudioContext || window.webkitAudioContext; audioCtx = new AC(); }
    await audioCtx.resume();
  }
  async function playAt(i) {
    if (!playlist.length) { setStatus("재생목록이 비어 있어요. 악보집에서 곡을 담아주세요.", true); return; }
    if (typeof ABCJS === "undefined") { setStatus("악보 엔진(abcjs)을 불러오지 못했습니다 — 인터넷 연결 시 동작합니다.", true); return; }
    if (i < 0) i = playlist.length - 1;
    if (i >= playlist.length) i = 0;
    var token = ++playToken;
    stopSynth();
    curIdx = i; isPlaying = true; isPaused = false;
    renderNow();
    $("stopBtn").disabled = false; $("pauseBtn").disabled = false; $("pauseBtn").textContent = "⏸ 일시정지";
    var it = playlist[i];
    var entry = findEntry(it);
    if (!entry || !entry.abc) {
      setStatus("'" + it.title + "'을(를) 악보집에서 찾지 못해 건너뜁니다.", true);
      return advance(token);
    }
    var vo = null;
    try { vo = ABCJS.renderAbc("holder", entry.abc, { add_classes: false })[0]; } catch (e) {}
    if (!vo) { setStatus("'" + it.title + "' 악보를 해석하지 못해 건너뜁니다.", true); return advance(token); }
    try { await ensureAudio(); } catch (e) { setStatus("이 브라우저에서 오디오를 시작할 수 없습니다.", true); stopAll(); return; }
    setStatus("♪ 준비 중… " + it.title);
    try {
      var sy = new ABCJS.synth.CreateSynth();
      var opts = { chordsOff: !$("chordAccChk").checked, onEnded: function () { if (token === playToken) advance(token); } };
      if ($("soundSel").value === "musyng") opts.soundFontUrl = MUSYNG;
      await sy.init({ audioContext: audioCtx, visualObj: vo, options: opts });
      await sy.prime();
      if (token !== playToken) return;   /* 준비 중 다른 곡으로 이동함 */
      synth = sy;
      sy.start();
      setStatus("♪ 재생 중 — " + it.title + ($("chordAccChk").checked ? "" : " (코드 반주 없음)"));
    } catch (e) {
      if (token !== playToken) return;
      setStatus("'" + it.title + "' 재생에 실패해 건너뜁니다. (음원 로딩 실패)", true);
      advance(token);
    }
  }
  function advance(token) {
    if (token !== playToken || !isPlaying) return;
    if (curIdx + 1 < playlist.length) playAt(curIdx + 1);
    else if ($("loopChk").checked && playlist.length) playAt(0);
    else { stopAll(); setStatus("🎉 재생목록을 다 들었어요! 다시 들으려면 ▶ 재생."); renderNow(); }
  }
  function startFrom(i) { playAt(i); }

  /* ── 컨트롤 ── */
  $("playBtn").addEventListener("click", function () {
    if (isPaused && synth && typeof synth.resume === "function") { synth.resume(); isPaused = false; $("pauseBtn").textContent = "⏸ 일시정지"; setStatus("♪ 이어서 재생"); return; }
    playAt(curIdx >= 0 ? curIdx : 0);
  });
  $("pauseBtn").addEventListener("click", function () {
    if (!synth) return;
    if (!isPaused && typeof synth.pause === "function") { synth.pause(); isPaused = true; $("pauseBtn").textContent = "▶ 계속"; setStatus("일시정지"); }
    else if (isPaused && typeof synth.resume === "function") { synth.resume(); isPaused = false; $("pauseBtn").textContent = "⏸ 일시정지"; setStatus("♪ 이어서 재생"); }
  });
  $("stopBtn").addEventListener("click", function () { stopAll(); setStatus("정지했어요."); });
  $("nextBtn").addEventListener("click", function () { if (playlist.length) playAt(curIdx + 1); });
  $("prevBtn").addEventListener("click", function () { if (playlist.length) playAt(curIdx - 1); });
  $("shuffleBtn").addEventListener("click", function () {
    for (var i = playlist.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = playlist[i]; playlist[i] = playlist[j]; playlist[j] = t; }
    curIdx = -1; stopAll(); saveList(); renderNow();
    setStatus("순서를 섞었어요. ▶ 재생으로 처음부터!");
  });
  $("clearBtn").addEventListener("click", function () {
    if (!playlist.length) return;
    playlist = []; curIdx = -1; stopAll(); saveList(); renderNow();
    setStatus("재생목록을 비웠어요.");
  });
  $("addAllBtn").addEventListener("click", function () {
    var es = libEntries().filter(function (e) { return e && e.abc; })
      .sort(function (a, b) { return (b.added || 0) - (a.added || 0); });
    if (!es.length) { setStatus("악보집이 비어 있어요.", true); return; }
    es.forEach(function (e) { playlist.push({ id: e.id || "", title: e.title || "(제목 없음)" }); });
    saveList(); renderNow();
    setStatus("악보집 " + es.length + "곡을 모두 담았어요.");
  });
  $("refreshBtn").addEventListener("click", function () { renderLibrary(); setStatus("악보집 목록을 새로 읽었어요."); });
  $("loopChk").addEventListener("change", savePrefs);
  $("chordAccChk").addEventListener("change", function () {
    savePrefs();
    if (isPlaying && !isPaused && curIdx >= 0) playAt(curIdx);   /* 즉시 반영해 다시 재생 */
  });
  $("soundSel").addEventListener("change", function () {
    savePrefs();
    if (isPlaying && !isPaused && curIdx >= 0) playAt(curIdx);
  });
  window.addEventListener("focus", renderLibrary);

  renderLibrary();
  renderNow();

  /* 테스트 훅 */
  if (typeof window !== "undefined") window.__player = {
    getState: function () { return { curIdx: curIdx, playing: isPlaying, paused: isPaused, count: playlist.length, titles: playlist.map(function (x) { return x.title; }) }; },
    playAt: playAt
  };
})();
</script>
</body>
</html>
